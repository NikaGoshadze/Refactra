name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect website-only changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web_only: ${{ steps.diff.outputs.web_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        name: Compare the pull request with its base
        # Website-only pull requests run only the web job (owner choice, 2026-11-28). Pushes to
        # main, and anything touching the backend, Docker files, manifests or the Compose smoke
        # test, run every job.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "web_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          web_only=true
          [ -n "$files" ] || web_only=false
          while IFS= read -r file; do
            case "$file" in
              apps/web/Dockerfile|tests/e2e/mock-run.spec.ts) web_only=false ;;
              apps/web/*|tests/e2e/*|tests/fixtures/*|README.md) ;;
              *) web_only=false ;;
            esac
          done <<< "$files"
          echo "web_only=$web_only" | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend lint and tests
    needs: changes
    if: needs.changes.outputs.web_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: refactra
          POSTGRES_PASSWORD: refactra_ci
          POSTGRES_DB: refactra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refactra -d refactra"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Tests migrate a disposable schema per test. The benchmark operator requires a local host.
      REFACTRA_TEST_DATABASE_URL: postgresql+psycopg://refactra:refactra_ci@localhost:5432/refactra
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: services/backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --group validation
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Pytest against PostgreSQL
        run: uv run --no-sync pytest -q

  web:
    name: Web lint, build and proxy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Typecheck
        # Runs after the build because Next.js generates route types during the build.
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Proxy and workflow UI tests
        # These start an isolated Next.js server against a simulated API; no Compose stack.
        # mock-run.spec.ts needs the Compose stack; the docker job runs it.
        run: >-
          npx playwright test
          tests/e2e/auth-proxy.spec.ts
          tests/e2e/repository-proxy.spec.ts
          tests/e2e/analysis-run-proxy.spec.ts
          tests/e2e/analysis-run-form.spec.ts
          tests/e2e/repository-connection.spec.ts
          tests/e2e/run-history.spec.ts
          tests/e2e/run-detail.spec.ts
          tests/e2e/sign-in.spec.ts
      - name: Upload sign-in review screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-in-review-screenshots
          path: |
            test-results/sign-in-*/sign-in-*.png
            test-results/sign-in-*/waitlist-*.png
          retention-days: 14

  docker:
    name: Docker validation and full-stack smoke
    needs: changes
    if: needs.changes.outputs.web_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # The Compose stack's PostgreSQL; each test migrates its own disposable schema.
      REFACTRA_TEST_DATABASE_URL: postgresql+psycopg://refactra:refactra_local@localhost:5433/refactra
      REFACTRA_TEST_PYTHON_DOCKER: "1"
      REFACTRA_TEST_TYPESCRIPT_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: services/backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install gVisor
        # Production runs repository tests under gVisor (runsc), so CI runs them the same way.
        # The release is pinned and checked against its published SHA-512.
        env:
          GVISOR_RELEASE: "20261109"
          GVISOR_SHA512: 1a6b8f74c37b4931ef473f67ec1f601690855bedc52ac709f2fac965c69677aa0426ef44598d8eee1aed72cfdb9df87a2a5f352cb3348880fc61a7732bc10f2a
        run: |
          curl -fsSLo /tmp/gvisor.tar.bz2 \
            "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  /tmp/gvisor.tar.bz2" | sha512sum -c -
          sudo tar -xjf /tmp/gvisor.tar.bz2 -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'
      - name: Build and start the Compose stack
        # This also builds refactra-backend:local, the validator's offline runner image.
        run: docker compose up --build --detach --wait --wait-timeout 300 api worker web
      - name: Check API readiness and the worker heartbeat
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8000/health/worker
      - name: Install backend test dependencies
        working-directory: services/backend
        run: uv sync --frozen --group validation
      - name: Docker validation runners
        # These tests skip without Docker; fail the job if any of them did not run. They run
        # under gVisor, and each runner is checked to really be on runsc.
        working-directory: services/backend
        env:
          REFACTRA_VALIDATION_RUNTIME: runsc
        run: |
          set -o pipefail
          uv run --no-sync pytest -q -rs tests/test_repository_validation.py tests/test_candidate_commit.py | tee pytest-docker.txt
          if grep -E "^SKIPPED" pytest-docker.txt; then
            echo "Docker-gated tests were skipped." >&2
            exit 1
          fi
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Full-stack browser smoke
        # Runs against the Compose web service on 127.0.0.1:3000 (the Playwright default).
        run: npx playwright test tests/e2e/mock-run.spec.ts
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
