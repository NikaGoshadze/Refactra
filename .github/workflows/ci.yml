name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: refactra
          POSTGRES_PASSWORD: refactra_ci
          POSTGRES_DB: refactra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U refactra -d refactra"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Tests migrate a disposable schema per test. The benchmark operator requires a local host.
      REFACTRA_TEST_DATABASE_URL: postgresql+psycopg://refactra:refactra_ci@localhost:5432/refactra
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: services/backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --group validation
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Pytest against PostgreSQL
        run: uv run --no-sync pytest -q

  web:
    name: Web lint, build and proxy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Typecheck
        # Runs after the build because Next.js generates route types during the build.
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Proxy and workflow UI tests
        # These start an isolated Next.js server against a simulated API; no Compose stack.
        # mock-run.spec.ts needs the Compose stack and is not run here.
        run: >-
          npx playwright test
          tests/e2e/auth-proxy.spec.ts
          tests/e2e/repository-proxy.spec.ts
          tests/e2e/analysis-run-proxy.spec.ts
          tests/e2e/analysis-run-form.spec.ts
          tests/e2e/repository-connection.spec.ts
