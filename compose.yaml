name: refactra

x-backend: &backend
  image: refactra-backend:local
  build:
    context: .
    dockerfile: services/backend/Dockerfile
    target: runtime
  environment: &backend-environment
    REFACTRA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-refactra}:${POSTGRES_PASSWORD:-refactra_local}@postgres:5432/${POSTGRES_DB:-refactra}
    REFACTRA_ENABLE_MOCK: ${REFACTRA_ENABLE_MOCK:-true}
    # production makes the API and worker refuse unsafe settings at startup.
    REFACTRA_ENVIRONMENT: ${REFACTRA_ENVIRONMENT:-development}
    # Spending limits (UTC days and months); see the README's usage limits section.
    REFACTRA_USER_DAILY_RUNS: ${REFACTRA_USER_DAILY_RUNS:-5}
    REFACTRA_USER_MONTHLY_USD: ${REFACTRA_USER_MONTHLY_USD:-3}
    REFACTRA_MONTHLY_USD: ${REFACTRA_MONTHLY_USD:-12}

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refactra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refactra_local}
      POSTGRES_DB: ${POSTGRES_DB:-refactra}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: [uv, run, --no-sync, alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *backend-environment
      REFACTRA_GITHUB_CLIENT_ID: ${REFACTRA_GITHUB_CLIENT_ID:-}
      REFACTRA_GITHUB_CLIENT_SECRET: ${REFACTRA_GITHUB_CLIENT_SECRET:-}
      REFACTRA_GITHUB_CALLBACK_URL: ${REFACTRA_GITHUB_CALLBACK_URL:-http://localhost:3000/api/v1/auth/github/callback}
      REFACTRA_OAUTH_STATE_SECRET: ${REFACTRA_OAUTH_STATE_SECRET:-}
      REFACTRA_TOKEN_ENCRYPTION_KEY: ${REFACTRA_TOKEN_ENCRYPTION_KEY:-}
      REFACTRA_GITHUB_APP_SLUG: ${REFACTRA_GITHUB_APP_SLUG:-}
    command: [uv, run, --no-sync, uvicorn, refactra.api:app, --host, 0.0.0.0, --port, "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, uv, run, --no-sync, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    <<: *backend
    command: [uv, run, --no-sync, python, -m, refactra.worker]
    # Restart after a database or process failure; `docker compose stop worker` stays stopped.
    restart: unless-stopped
    healthcheck:
      test: [CMD, uv, run, --no-sync, python, -m, refactra.worker, --health]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: refactra-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      REFACTRA_API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/capabilities').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  github-check:
    <<: *backend
    profiles: [github-check]
    environment:
      REFACTRA_GITHUB_CLIENT_ID: ${REFACTRA_GITHUB_CLIENT_ID:-}
      REFACTRA_GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
    volumes:
      - type: bind
        source: ./.runtime/secrets/github-app.pem
        target: /run/secrets/github-app.pem
        read_only: true
        bind:
          create_host_path: false
    # Append the repository ID: docker compose --profile github-check run --rm github-check ID
    entrypoint: [uv, run, --no-sync, python, -m, refactra.github_repository_check]
    command: []

  test:
    <<: *backend
    image: refactra-backend:test
    build:
      context: .
      dockerfile: services/backend/Dockerfile
      target: test
    profiles: [test]
    environment:
      REFACTRA_TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-refactra}:${POSTGRES_PASSWORD:-refactra_local}@postgres:5432/${POSTGRES_DB:-refactra}
    command: [uv, run, --no-sync, pytest, -q]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
