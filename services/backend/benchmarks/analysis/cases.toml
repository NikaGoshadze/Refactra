[[cases]]
id = "python-calculation"
language = "python"
task = "Propose a small extraction of duplicated invoice/quote calculation logic without changing behavior. Analyze only; cite supplied paths and lines."
[cases.files]
"src/pricing.py" = '''
from decimal import Decimal, ROUND_HALF_UP

def invoice_total(prices, discount):
    subtotal = sum(prices, Decimal("0"))
    return (subtotal * (Decimal("1") - discount)).quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)

def quote_total(prices, discount):
    subtotal = sum(prices, Decimal("0"))
    return (subtotal * (Decimal("1") - discount)).quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)
'''
"tests/test_pricing.py" = '''
from decimal import Decimal as D
from pricing import invoice_total, quote_total

def test_totals():
    for calculate in (invoice_total, quote_total):
        assert calculate([], D("0")) == D("0.00")
        assert calculate([D("1.005")], D("0")) == D("1.01")
        assert calculate([D("10")], D("0.1")) == D("9.00")
'''

[[cases]]
id = "python-module-split"
language = "python"
task = "Propose moving row parsing out of reports.py while preserving callers and current error behavior. Analyze only; cite supplied paths and lines."
[cases.files]
"src/reports.py" = '''
import csv
from io import StringIO

def parse_rows(text):
    rows = list(csv.DictReader(StringIO(text)))
    for row in rows:
        if not row.get("name"):
            raise ValueError("name required")
    return rows

def build_report(text):
    return [row["name"].upper() for row in parse_rows(text)]
'''
"src/cli.py" = '''
from reports import parse_rows

def names(text):
    return [row["name"] for row in parse_rows(text)]
'''
"tests/test_reports.py" = '''
import pytest
from cli import names
from reports import build_report, parse_rows

def test_reports():
    assert parse_rows("name\nAda\n") == [{"name": "Ada"}]
    assert names("name\nAda\n") == ["Ada"]
    assert build_report("name\nAda\n") == ["ADA"]
    assert parse_rows("") == []
    with pytest.raises(ValueError, match="^name required$"):
        parse_rows("name,age\n,3\n")
'''

