task = "Propose consolidating duplicated required-value validation without changing its accepted inputs. Analyze only; cite supplied paths and lines."
[cases.files]
"src/validation.ts" = '''
export function profileError(value: unknown): string | null {
  if (value === undefined || value === null || value === "") return "Required";
  return null;
}

export function settingsError(value: unknown): string | null {
  if (value === undefined || value === null || value === "") return "Required";
  return null;
}
'''
"src/validation.test.ts" = '''
import { profileError, settingsError } from "./validation";

for (const validate of [profileError, settingsError]) {
  for (const value of [undefined, null, ""]) {
    if (validate(value) !== "Required") throw new Error("missing value");
  }
  for (const value of [0, false, " ", "Ada"]) {
    if (validate(value) !== null) throw new Error("accepted value");
  }
}
'''

[[cases]]
id = "react-derived-list"
language = "tsx"
task = "Propose extracting filtering/sorting into a reusable pure helper while keeping the hook's public interface and behavior. Analyze only; cite supplied paths and lines."
[cases.files]
"src/useVisibleItems.ts" = '''
import { useMemo } from "react";

export type Item = { id: string; name: string; active: boolean; rank: number };
export function useVisibleItems(items: Item[], query: string) {
  return useMemo(() => items
    .filter(item => item.active && item.name.includes(query))
    .sort((a, b) => a.rank - b.rank), [items, query]);
}
'''
"src/List.tsx" = '''
import { useState } from "react";
import { Item, useVisibleItems } from "./useVisibleItems";

export function List({ items }: { items: Item[] }) {
  const [query, setQuery] = useState("");
  const visible = useVisibleItems(items, query);
  return <><input aria-label="Filter" value={query} onChange={e => setQuery(e.target.value)} />
    <ul>{visible.map(item => <li key={item.id}>{item.name}</li>)}</ul></>;
}
'''

